version: "3.9"

services:

  # ── MySQL for BacklogService ─────────────────────────────────────────────────
  backlog-db:
    image: mysql:8.0
    container_name: backlog-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: backlog
    ports:
      - "3309:3306"          # host 3309 → container 3306 (avoids port collisions)
    volumes:
      - backlog_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Eureka Discovery Server ──────────────────────────────────────────────────
  # BacklogService uses Feign clients (ProjectClient, SprintClient,
  # NotificationClient) that all resolve via Eureka, so the registry
  # must be healthy before this service starts.
  discovery-server:
    build:
      context: ../discovery-server
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── BacklogService ───────────────────────────────────────────────────────────
  backlog-service:
    build:
      context: .
    container_name: backlog-service
    restart: unless-stopped
    depends_on:
      backlog-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      SPRING_DATASOURCE_URL: jdbc:mysql://backlog-db:3306/backlog?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # ── Eureka ────────────────────────────────────────────────────────────
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_APPLICATION_NAME: ms-backlog

volumes:
  backlog_db_data: