version: "3.9"

services:

  # ── MySQL for ProjectService ─────────────────────────────────────────────────
  project-db:
    image: mysql:8.0
    container_name: project-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: projet           # matches the DB name in application.properties
    ports:
      - "3308:3306"          # host 3308 → container 3306 (avoids port collisions)
    volumes:
      - project_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Eureka Discovery Server ──────────────────────────────────────────────────
  # ProjectService also calls the NotificationService (via RestTemplate / WebClient
  # using the NotificationRequest DTO), so the registry must be up first.
  discovery-server:
    build:
      context: ../discovery-server
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── ProjectService ───────────────────────────────────────────────────────────
  project-service:
    build:
      context: .
    container_name: project-service
    restart: unless-stopped
    depends_on:
      project-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      SPRING_DATASOURCE_URL: jdbc:mysql://project-db:3306/projet?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # ── Eureka ────────────────────────────────────────────────────────────
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_APPLICATION_NAME: ms-projects

volumes:
  project_db_data: