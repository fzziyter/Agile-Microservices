version: "3.9"

services:

  # ── Eureka Discovery Server ──────────────────────────────────────────────────
  # Standalone deployment of the Eureka registry.
  # All other services point their eureka.client.service-url.defaultZone
  # at this container's hostname (discovery-server:8761).
  #
  # Self-registration is intentionally disabled in application.properties:
  #   eureka.client.register-with-eureka=false
  #   eureka.client.fetch-registry=false
  discovery-server:
    build:
      context: .
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: discovery-server
      # Override hostname so registered clients can reach it by container name
      # inside a shared Docker network (used by the root docker-compose).
      EUREKA_INSTANCE_HOSTNAME: discovery-server
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10