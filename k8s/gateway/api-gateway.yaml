apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - env:
        - name: SPRING_APPLICATION_NAME
          value: api-gateway
        - name: SERVER_PORT
          value: '8080'
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          value: http://discovery-server:8761/eureka/
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "true"
        - name: SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWEDORIGINS_0
          value: http://localhost:3000
        - name: SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWEDORIGINS_1
          value: http://localhost:5173
        image: api-gateway:latest
        imagePullPolicy: Never
        name: api-gateway
        ports:
        - containerPort: 8080
      initContainers:
      - command:
        - sh
        - -c
        - until wget -qO- http://discovery-server:8761/actuator/health | grep UP;
          do echo "Waiting for Eureka..."; sleep 5; done
        image: busybox:1.36
        name: wait-for-eureka
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: default
spec:
  ports:
  - nodePort: 30080
    port: 8080
    targetPort: 8080
  selector:
    app: api-gateway
  type: NodePort
