apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-projects-config
data:
  application.properties: |
    server.port=8082
    spring.application.name=ms-projects

    spring.datasource.url=jdbc:mysql://mysql:3306/projet?createDatabaseIfNotExist=true
    spring.datasource.username=root
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true

    eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
