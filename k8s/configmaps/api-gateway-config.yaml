apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  application.yml: |
    server:
      port: 8080

    spring:
      application:
        name: api-gateway
      cloud:
        gateway:
          routes:
            - id: auth-route
              uri: lb://MS-AUTH-USER
              predicates:
                - Path=/api/auth/**, /api/admin/**

            - id: projects-route
              uri: lb://MS-PROJECTS
              predicates:
                - Path=/api/projects/**

            - id: backlog-route
              uri: lb://MS-BACKLOG
              predicates:
                - Path=/api/backlog/**

            - id: sprints-route
              uri: lb://MS-SPRINTS
              predicates:
                - Path=/api/sprints/**

            - id: notifications-route
              uri: lb://MS-NOTIFICATIONS
              predicates:
                - Path=/api/notifications/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowedHeaders: "*"
                allowCredentials: true
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE

    eureka:
      client:
        service-url:
          defaultZone: http://discovery-server:8761/eureka/

    logging:
      level:
        org.springframework.cloud.gateway: INFO
