version: "3.9"

services:

  # ── MySQL for AuthUserService ────────────────────────────────────────────────
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"          # host 3307 → container 3306 (avoids collisions)
    volumes:
      - auth_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Eureka Discovery Server ──────────────────────────────────────────────────
  # The AuthUserService registers with Eureka, so it must start first.
  # Replace the image tag / build path if you have your own discovery-server image.
  discovery-server:
    build:
      context: ../discovery-server          # relative to this docker-compose file
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── AuthUserService ──────────────────────────────────────────────────────────
  auth-user-service:
    build:
      context: .                            # directory that contains the Dockerfile
    container_name: auth-user-service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/auth_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # ── JWT ───────────────────────────────────────────────────────────────
      # Override the secret via an env var so you never commit secrets to source control.
      JWT_SECRET: ${JWT_SECRET:-MySuperSecretKeyForJWTThatIsAtLeast32Chars!}
      JWT_EXPIRATION_MS: 86400000

      # ── Eureka ────────────────────────────────────────────────────────────
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_APPLICATION_NAME: ms-auth-user

volumes:
  auth_db_data: